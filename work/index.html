const $=id=>document.getElementById(id);
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function embed(id,muted=true){return `https://www.youtube.com/embed/${id}?autoplay=1&mute=${muted?1:0}&controls=1&modestbranding=1&rel=0&playsinline=1`}

const ALL_ITEMS=[];
PROJECTS.forEach(p=>{ p.clips.forEach(c=>{ ALL_ITEMS.push({project:p,clip:c}); }); });

function seededRand(seed){ const x=Math.sin(seed*9999)*10000; return x-Math.floor(x); }

const canvasWrap=$('canvasWrap'), canvasTrack=$('canvasTrack');
const COLS=7;
const ROWS=Math.ceil(ALL_ITEMS.length/COLS);
const CELL_W=420, CELL_H=380;
const CANVAS_W=COLS*CELL_W+240, CANVAS_H=ROWS*CELL_H+240;

const TILE_SPECS=ALL_ITEMS.map((item,i)=>{
 const col=i%COLS, row=Math.floor(i/COLS);
 const targetW=230+seededRand(i*3+1)*70;
 const parts=item.clip.ratio.split('/').map(Number);
 const ratio=parts[0]/parts[1];
 const maxBoxW=CELL_W*0.68, maxBoxH=CELL_H*0.68;
 let w=targetW, h=w/ratio;
 if(h>maxBoxH){ h=maxBoxH; w=h*ratio; }
 if(w>maxBoxW){ w=maxBoxW; h=w/ratio; }
 const maxJitterX=Math.max(6,(CELL_W-w)/2-10);
 const maxJitterY=Math.max(6,(CELL_H-h)/2-10);
 const jitterX=(seededRand(i*2+1)-0.5)*2*maxJitterX;
 const jitterY=(seededRand(i*2+2)-0.5)*2*maxJitterY;
 const cx=120+col*CELL_W+CELL_W/2+jitterX;
 const cy=120+row*CELL_H+CELL_H/2+jitterY;
 return {item,w,h,cx,cy,i};
});

const WRAP_OFFSETS=[-1,0,1];
WRAP_OFFSETS.forEach(oy=>{
 WRAP_OFFSETS.forEach(ox=>{
  TILE_SPECS.forEach(spec=>{
   const {item,w,h,cx,cy,i}=spec;
   const tile=document.createElement('div');
   tile.className='ctile';
   tile.style.left=(cx-w/2+ox*CANVAS_W)+'px';
   tile.style.top=(cy-h/2+oy*CANVAS_H)+'px';
   tile.style.width=w+'px';
   tile.style.height=h+'px';
   tile.style.zIndex=String(100+i);
   tile.innerHTML='<img src="'+item.clip.poster+'" alt="'+item.project.title+'" loading="lazy"><div class="clabel">'+item.project.title+'</div>';
   if(ox===0&&oy===0){
    tile.tabIndex=0;
    tile.setAttribute('role','button');
    tile.setAttribute('aria-label','Open '+item.project.title);
   } else {
    tile.setAttribute('aria-hidden','true');
   }
   tile._activate=()=>openInArchive(item.project,item.clip);
   tile.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openInArchive(item.project,item.clip); } };
   canvasTrack.appendChild(tile);
  });
 });
});

let panX=0,panY=0,dragging=false,canvasMoved=false,pointerDownTile=null;
let startClientX=0,startClientY=0,lastClientX=0,lastClientY=0,lastT=0;
let velX=0,velY=0,momentumRaf=null;

function wrapVal(v,size){ let m=v%size; if(m>0)m-=size; return m; }
function wrapPan(){ panX=wrapVal(panX,CANVAS_W); panY=wrapVal(panY,CANVAS_H); }
function applyPan(){ canvasTrack.style.transform='translate('+panX.toFixed(1)+'px,'+panY.toFixed(1)+'px)'; }
function centerCanvas(){
 const vw=canvasWrap.clientWidth, vh=canvasWrap.clientHeight;
 const focalX=1614.95, focalY=715.85;
 panX=vw/2-focalX; panY=vh/2-focalY;
 wrapPan(); applyPan();
}
centerCanvas();
window.addEventListener('resize',()=>{ applyPan(); });

canvasWrap.addEventListener('pointerdown',e=>{
 dragging=true; canvasMoved=false;
 pointerDownTile=e.target.closest('.ctile');
 startClientX=lastClientX=e.clientX; startClientY=lastClientY=e.clientY;
 lastT=performance.now(); velX=0; velY=0;
 if(momentumRaf){ cancelAnimationFrame(momentumRaf); momentumRaf=null; }
 canvasWrap.classList.add('dragging');
 canvasWrap.setPointerCapture(e.pointerId);
});
canvasWrap.addEventListener('pointermove',e=>{
 if(!dragging)return;
 const dx=e.clientX-lastClientX, dy=e.clientY-lastClientY;
 if(Math.abs(e.clientX-startClientX)>12||Math.abs(e.clientY-startClientY)>12) canvasMoved=true;
 panX+=dx; panY+=dy; wrapPan(); applyPan();
 const now=performance.now(); const dt=Math.max(1,now-lastT);
 velX=dx/dt; velY=dy/dt;
 lastClientX=e.clientX; lastClientY=e.clientY; lastT=now;
});
function endDrag(){
 if(!dragging)return;
 dragging=false;
 canvasWrap.classList.remove('dragging');
 if(!canvasMoved && pointerDownTile){ pointerDownTile._activate&&pointerDownTile._activate(); }
 pointerDownTile=null;
 setTimeout(()=>{canvasMoved=false;},0);
 if(reduceMotion) return;
 function momentum(){
  panX+=velX*16; panY+=velY*16;
  velX*=0.92; velY*=0.92;
  wrapPan();
  applyPan();
  if(Math.abs(velX)>0.01||Math.abs(velY)>0.01){ momentumRaf=requestAnimationFrame(momentum); } else { momentumRaf=null; }
 }
 momentumRaf=requestAnimationFrame(momentum);
}
canvasWrap.addEventListener('pointerup',endDrag);
canvasWrap.addEventListener('pointercancel',endDrag);
const appEl=document.querySelector('.app');
const RELEASE_THRESHOLD=1400;
let downAccum=0, leavingCanvas=false;
canvasWrap.addEventListener('wheel',e=>{
 e.preventDefault();
 if(leavingCanvas) return;
 if(momentumRaf){ cancelAnimationFrame(momentumRaf); momentumRaf=null; }
 panX-=e.deltaX; panY-=e.deltaY; wrapPan(); applyPan();
 if(!reduceMotion && Math.abs(e.deltaY)>Math.abs(e.deltaX)){
  downAccum=Math.max(0,Math.min(RELEASE_THRESHOLD,downAccum+e.deltaY));
  const progress=downAccum/RELEASE_THRESHOLD;
  appEl.style.transition='none';
  appEl.style.transform='translateY('+(-progress*70)+'px) scale('+(1-progress*0.035)+')';
  appEl.style.opacity=String(1-progress*0.4);
  if(downAccum>=RELEASE_THRESHOLD){
   leavingCanvas=true;
   appEl.style.transition='transform .6s cubic-bezier(.16,1,.3,1),opacity .6s ease';
   appEl.style.transform='translateY(-130px) scale(0.94)';
   appEl.style.opacity='0.15';
   setTimeout(()=>{
    $('archive').scrollIntoView({behavior:'smooth',block:'start'});
    setTimeout(()=>{
     appEl.style.transition='';
     appEl.style.transform='';
     appEl.style.opacity='';
     downAccum=0;
     leavingCanvas=false;
    },700);
   },250);
  }
 }
},{passive:false});

const archiveListEl=$('archiveList');
let aActive=0, aExpanded=null, apProject=null, apClipIndex=0, apPlaying=true, apMuted=false;

function renderArchiveList(){
 archiveListEl.innerHTML='';
 PROJECTS.forEach((p,i)=>{
  const row=document.createElement('div');
  row.className='a-row'+(i===aActive?' active':'')+(i===aExpanded?' expanded':'');
  const head=document.createElement('div');
  head.className='a-row-head';
  head.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span class="name">'+p.title+'</span><span class="year">'+p.date.split(' ').pop()+'</span><span class="chev">⌄</span><div class="bar"></div>';
  head.onclick=()=>toggleArchiveRow(i);
  row.appendChild(head);
  const clipsWrap=document.createElement('div');
  clipsWrap.className='a-clips';
  clipsWrap.style.maxHeight=(i===aExpanded?(p.clips.length*56+24)+'px':'0');
  p.clips.forEach((c,ci)=>{
   const cr=document.createElement('div');
   cr.className='a-clip-row'+(apProject===p&&apClipIndex===ci?' active':'');
   cr.innerHTML='<div class="thumb"><img src="'+c.poster+'" alt=""></div><span class="label">Clip '+(ci+1)+' · '+c.ratio+'</span>';
   cr.onclick=e=>{ e.stopPropagation(); openArchivePreview(p,ci); openExpandedModal(p,ci); };
   clipsWrap.appendChild(cr);
  });
  row.appendChild(clipsWrap);
  archiveListEl.appendChild(row);
 });
}
function toggleArchiveRow(i){
 aExpanded = aExpanded===i?null:i;
 aActive=i;
 if(aExpanded===i){ openArchivePreview(PROJECTS[i],0); } else { renderArchiveList(); }
}
function apMediaHTML(clip){return clip.video?`<video src="${clip.video}" poster="${clip.poster}" autoplay muted playsinline></video>`:`<iframe src="${embed(clip.youtube,true)}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`}
function updateApArrows(){
 $('apPrev').disabled = apClipIndex<=0;
 $('apNext').disabled = apClipIndex>=apProject.clips.length-1;
}
function updateApCtrlIcons(){
 $('apPlayPause').textContent=apPlaying?'❚❚':'▶';
 $('apPlayPause').setAttribute('aria-label',apPlaying?'Pause':'Play');
 $('apMute').textContent=apMuted?'🔇':'🔊';
 $('apMute').setAttribute('aria-label',apMuted?'Unmute':'Mute');
}
function openArchivePreview(project,clipIndex){
 apProject=project; apClipIndex=clipIndex;
 const clip=project.clips[clipIndex];
 $('apMedia').innerHTML=apMediaHTML(clip);
 $('apBadge').textContent=project.category;
 $('apCaption').textContent=project.title+' — '+project.subtitle;
 apPlaying=true; apMuted=true;
 updateApCtrlIcons(); updateApArrows();
 renderArchiveList();
 if(!reduceMotion){
  const pv=$('archivePreview');
  pv.classList.remove('pop');
  void pv.offsetWidth;
  pv.classList.add('pop');
 }
}
function apStep(d){
 if(!apProject) return;
 const next=Math.max(0,Math.min(apProject.clips.length-1,apClipIndex+d));
 if(next===apClipIndex) return;
 openArchivePreview(apProject,next);
}
function apYtCommand(func){
 const iframe=$('apMedia').querySelector('iframe');
 if(iframe) iframe.contentWindow.postMessage(JSON.stringify({event:'command',func,args:[]}),'*');
}
function silenceArchivePreview(){
 apMuted=true;
 const video=$('apMedia').querySelector('video');
 if(video) video.muted=true;
 apYtCommand('mute');
 updateApCtrlIcons();
}
function apTogglePlayPause(){
 const video=$('apMedia').querySelector('video');
 if(video){ video.paused?video.play():video.pause(); apPlaying=!video.paused; }
 else { apYtCommand(apPlaying?'pauseVideo':'playVideo'); apPlaying=!apPlaying; }
 updateApCtrlIcons();
}
function apToggleMute(){
 const video=$('apMedia').querySelector('video');
 if(video){ video.muted=!video.muted; apMuted=video.muted; }
 else { apYtCommand(apMuted?'unMute':'mute'); apMuted=!apMuted; }
 updateApCtrlIcons();
}
$('apPrev').onclick=()=>apStep(-1);
$('apNext').onclick=()=>apStep(1);
$('apPlayPause').onclick=apTogglePlayPause;
$('apMute').onclick=apToggleMute;
function toggleFullscreen(el){
 if(document.fullscreenElement){ document.exitFullscreen(); }
 else { el.requestFullscreen&&el.requestFullscreen(); }
}
$('apFullscreen').onclick=()=>toggleFullscreen($('archivePreview'));
document.addEventListener('keydown',e=>{
 if(!document.activeElement||!$('archive').contains(document.activeElement)) return;
 if(e.key==='ArrowLeft')apStep(-1);
 if(e.key==='ArrowRight')apStep(1);
});

renderArchiveList();
openArchivePreview(PROJECTS[0],0);

function openInArchive(project,clip){
 const idx=PROJECTS.indexOf(project);
 aActive=idx; aExpanded=idx;
 const clipIndex=project.clips.indexOf(clip);
 openArchivePreview(project,clipIndex);
 $('archive').scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'});
 openExpandedModal(project,clipIndex);
}

let emProject=null, emClipIndex=0, emPlaying=true, emMuted=false;
function emMediaHTML(clip){return clip.video?`<video src="${clip.video}" poster="${clip.poster}" autoplay playsinline></video>`:`<iframe src="${embed(clip.youtube,false)}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`}
function parseClipRatio(r){ const p=r.split('/').map(Number); return p[0]/p[1]; }
function emApplySize(ratio){
 const maxW=Math.min(window.innerWidth*0.84,1200), maxH=window.innerHeight*0.84;
 let w=maxW, h=w/ratio;
 if(h>maxH){ h=maxH; w=h*ratio; }
 $('emBox').style.width=w+'px';
 $('emBox').style.height=h+'px';
}
function updateEmArrows(){ $('emPrev').disabled=emClipIndex<=0; $('emNext').disabled=emClipIndex>=emProject.clips.length-1; }
function updateEmCtrlIcons(){ $('emPlayPause').textContent=emPlaying?'❚❚':'▶'; $('emPlayPause').setAttribute('aria-label',emPlaying?'Pause':'Play'); $('emMute').textContent=emMuted?'🔇':'🔊'; $('emMute').setAttribute('aria-label',emMuted?'Unmute':'Mute'); }
function openExpandedModal(project,clipIndex){
 silenceArchivePreview();
 emProject=project; emClipIndex=clipIndex;
 const clip=project.clips[clipIndex];
 emApplySize(parseClipRatio(clip.ratio));
 $('emMedia').innerHTML=emMediaHTML(clip);
 $('emBadge').textContent=project.category;
 $('emCaption').textContent=project.title+' — '+project.subtitle;
 emPlaying=true; emMuted=false;
 updateEmCtrlIcons(); updateEmArrows();
 $('emBackdrop').style.display='flex';
 requestAnimationFrame(()=>requestAnimationFrame(()=>{ $('emBackdrop').classList.add('open'); }));
}
function closeExpandedModal(){
 $('emBackdrop').classList.remove('open');
 setTimeout(()=>{ $('emBackdrop').style.display='none'; $('emMedia').innerHTML=''; },500);
}
function emStep(d){
 if(!emProject) return;
 const next=Math.max(0,Math.min(emProject.clips.length-1,emClipIndex+d));
 if(next===emClipIndex) return;
 emClipIndex=next;
 const clip=emProject.clips[emClipIndex];
 emApplySize(parseClipRatio(clip.ratio));
 $('emMedia').innerHTML=emMediaHTML(clip);
 $('emCaption').textContent=emProject.title+' — '+emProject.subtitle;
 emPlaying=true; emMuted=false;
 updateEmCtrlIcons(); updateEmArrows();
}
function emYtCommand(func){ const iframe=$('emMedia').querySelector('iframe'); if(iframe) iframe.contentWindow.postMessage(JSON.stringify({event:'command',func,args:[]}),'*'); }
function emTogglePlayPause(){
 const video=$('emMedia').querySelector('video');
 if(video){ video.paused?video.play():video.pause(); emPlaying=!video.paused; }
 else { emYtCommand(emPlaying?'pauseVideo':'playVideo'); emPlaying=!emPlaying; }
 updateEmCtrlIcons();
}
function emToggleMute(){
 const video=$('emMedia').querySelector('video');
 if(video){ video.muted=!video.muted; emMuted=video.muted; }
 else { emYtCommand(emMuted?'unMute':'mute'); emMuted=!emMuted; }
 updateEmCtrlIcons();
}
$('emClose').onclick=closeExpandedModal;
$('emBackdrop').onclick=e=>{ if(e.target.id==='emBackdrop') closeExpandedModal(); };
$('emPrev').onclick=()=>emStep(-1);
$('emNext').onclick=()=>emStep(1);
$('emPlayPause').onclick=emTogglePlayPause;
$('emMute').onclick=emToggleMute;
$('emFullscreen').onclick=()=>toggleFullscreen($('emBox'));
document.addEventListener('keydown',e=>{
 if($('emBackdrop').style.display!=='flex') return;
 if(e.key==='Escape') closeExpandedModal();
 if(e.key==='ArrowLeft') emStep(-1);
 if(e.key==='ArrowRight') emStep(1);
});

document.addEventListener('mousemove',e=>{document.documentElement.style.setProperty('--mx',e.clientX/window.innerWidth*100+'%');document.documentElement.style.setProperty('--my',e.clientY/window.innerHeight*100+'%')});
</script>
</body>
</html>
